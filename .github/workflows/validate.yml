name: Validate Tool Documents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run validation
        run: python scripts/validate_tools.py

      - name: Show report
        if: always()
        run: cat validation_report.json 2>/dev/null || echo "No report generated"
